plugins {
    id 'java'
    id 'java-library'
    id 'jacoco'
    id "io.freefair.lombok" version "8.14"
    id 'com.diffplug.spotless' version '6.25.0'
    id 'opensearch.build'
    id 'opensearch.java-agent'
    id 'eclipse'
}

repositories {
    mavenLocal()
    maven { url = uri("https://ci.opensearch.org/ci/dbc/snapshots/maven/") }
    mavenCentral()
    maven { url = uri("https://plugins.gradle.org/m2/") }
}

description = "k-NN Vector Engine SPI"

compileJava {
    options.compilerArgs = ["-processor", 'lombok.launch.AnnotationProcessorHider$AnnotationProcessor']
}
compileTestJava {
    options.compilerArgs = ["-processor", 'lombok.launch.AnnotationProcessorHider$AnnotationProcessor']
}

dependencies {
    api project(":remote-index-build-client")

    // Declare guava as compile time since guava will come from OpenSearch transport-grpc module.
    compileOnly group: 'com.google.guava', name: 'guava', version: "${versions.guava}"
    compileOnly group: 'org.opensearch', name: 'opensearch', version: "${opensearch_version}"
    testImplementation "org.opensearch.test:framework:${opensearch_version}"
}

check.dependsOn spotlessCheck

publishing {
    publications {
        pluginZip(MavenPublication) {
            pom {
                name = "opensearch-knn-engine-spi"
                description = 'k-NN Vector Engine SPI'
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        name = "OpenSearch"
                        url = "https://github.com/opensearch-project/k-NN/remote-index-build-client"
                    }
                }
            }
        }
    }
}